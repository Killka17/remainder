services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: admin
      POSTGRES_DB: remainder
    ports:
      - 5432:5432

  backend:
    container_name: scala-backend
    build: .
    volumes:
      - ./remainder:/app
    restart: always
    environment:
      CHAT_ID: ???
      POSTGRES_DB: remainder
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: 1234
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - 8080:8080
    

